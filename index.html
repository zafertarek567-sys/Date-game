<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you go on a date with me? 💐</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; min-height: 100%;
  font-family: Arial, sans-serif;
}
body {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg,#ffdce8,#eadcff);
  overflow: hidden;
}
.card {
  width: min(92vw, 430px);
  background: #fffdfd;
  border-radius: 28px;
  padding: 28px 22px 30px;
  text-align: center;
  box-shadow: 0 18px 55px rgba(80,40,80,.18);
}
.photo {
  width: 125px; height: 125px;
  object-fit: cover; border-radius: 24px;
  display: block; margin: 0 auto 20px;
}
h1 {
  color: #a52f68;
  font-size: 25px;
  line-height: 1.25;
  margin: 8px 0 28px;
}
.stage {
  position: relative;
  height: 110px;
  width: 100%;
}
button {
  border: 0; border-radius: 999px;
  padding: 14px 28px;
  font-size: 17px; font-weight: 700;
  color: white; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#yes { background: #e62f82; }
#no {
  background: #b987df;
  position: absolute;
  left: 58%;
  top: 25px;
  transform: translateX(-50%);
}
.message {
  display: none;
  color: #a52f68;
  font-size: 20px;
  font-weight: 700;
  margin-top: 8px;
}
.small { color:#9b8190; font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<div class="card">
  <img class="photo" src="save-dateoh.png" alt="photo">
  <h1>🌸 Will you go on a date with me? 🌸</h1>

  <div class="stage" id="stage">
    <button id="yes">YES ♥</button>
    <button id="no">NO 😈</button>
  </div>

  <div class="message" id="message">I knew you'd say yes 😌❤️</div>
  <div class="small">Choose wisely 👀</div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const stage = document.getElementById("stage");
const message = document.getElementById("message");

function moveNo(e) {
  if (e) e.preventDefault();
  const padding = 5;
  const maxX = Math.max(padding, stage.clientWidth - noBtn.offsetWidth - padding);
  const maxY = Math.max(padding, stage.clientHeight - noBtn.offsetHeight - padding);
  noBtn.style.transform = "none";
  noBtn.style.left = (padding + Math.random() * (maxX - padding)) + "px";
  noBtn.style.top = (padding + Math.random() * (maxY - padding)) + "px";
}

["pointerenter","pointerdown","touchstart","focus"].forEach(eventName => {
  noBtn.addEventListener(eventName, moveNo, {passive:false});
});

yesBtn.style.position = "absolute";
yesBtn.style.left = "28%";
yesBtn.style.top = "25px";
yesBtn.style.transform = "translateX(-50%)";

yesBtn.addEventListener("click", () => {
  message.style.display = "block";
  yesBtn.textContent = "DATE LOCKED 💕";
  noBtn.style.display = "none";
});
</script>
</body>
</html>
